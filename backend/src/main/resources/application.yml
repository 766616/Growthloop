# All secrets come from environment variables (see backend/.env.example).
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: growthloop-backend
  # Loads backend/.env automatically when present (values are still overridable by real env vars)
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/growthloop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:growthloop_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: true
    properties:
      hibernate:
        jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # MUST be set in real deployments: at least 32 characters.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_KEY:}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    demo-password-admin: ${DEMO_ADMIN_PASSWORD:Admin@123}
    demo-password-teacher: ${DEMO_TEACHER_PASSWORD:Teacher@123}
    demo-password-student: ${DEMO_STUDENT_PASSWORD:Student@123}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.growthloop: INFO
