# Local MySQL for GrowthLoop. Copy .env.example to .env and set unique passwords first.
services:
  mysql:
    image: mysql:8.4
    container_name: growthloop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env file}
      MYSQL_DATABASE: growthloop
      MYSQL_USER: ${DB_USERNAME:-growthloop_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env file}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - growthloop-data:/var/lib/mysql
volumes:
  growthloop-data:
